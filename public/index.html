<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Private live voice translator powered by Soniox.">
  <title>Live Translate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="loginShell" class="screen login-screen">
    <section class="login-panel" aria-label="Live Translate login">
      <div class="login-brand">
        <div class="wave-logo wave-logo-large" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1>Live Translate</h1>
        <p>Enter your access code to continue</p>
      </div>

      <form id="loginForm" class="login-form">
        <label class="sr-only" for="accessCode">Access Code</label>
        <div class="input-shell">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 10V8a5 5 0 0 1 10 0v2"></path>
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M12 14v2"></path>
            </svg>
          </span>
          <input id="accessCode" type="password" inputmode="text" autocomplete="current-password" placeholder="Access Code" required>
        </div>
        <button class="primary-btn unlock-btn" type="submit">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 10V8a5 5 0 0 1 9.58-2"></path>
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M12 14v2"></path>
            </svg>
          </span>
          <span>Unlock App</span>
        </button>
        <p id="loginStatus" class="status-text login-status" aria-live="polite"></p>
      </form>

      <p class="privacy-note">
        <span class="shield-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 3 19 6v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-3Z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </span>
        <span>Private access for your translator</span>
      </p>
    </section>
  </main>

  <main id="appShell" class="screen app-screen" hidden>
    <section class="translator-panel" aria-label="Live Translate">
      <header class="app-header">
        <div class="app-title">
          <div class="wave-logo" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <h1>Live Translate</h1>
        </div>
      </header>

      <section class="language-panel" aria-label="Language selection">
        <div class="select-shell language-select">
          <label class="sr-only" for="langA">Source language</label>
          <select id="langA" autocomplete="off" aria-label="Source language"></select>
        </div>

        <button id="swapBtn" class="swap-btn" type="button" aria-label="Swap languages">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M7 7h11l-3-3"></path>
            <path d="M18 7l-3 3"></path>
            <path d="M17 17H6l3 3"></path>
            <path d="M6 17l3-3"></path>
          </svg>
        </button>

        <div class="select-shell language-select">
          <label class="sr-only" for="langB">Target language</label>
          <select id="langB" autocomplete="off" aria-label="Target language"></select>
        </div>
      </section>

      <section class="settings-panel" aria-label="Voice and speed">
        <div class="setting-block voice-block">
          <span class="setting-icon mic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </span>
          <label class="sr-only" for="voiceSelect">Voice</label>
          <select id="voiceSelect" autocomplete="off" aria-label="Voice">
            <option value="Adrian">Loading voices...</option>
          </select>
        </div>

        <span class="settings-divider" aria-hidden="true"></span>

        <div class="setting-block speed-block">
          <span class="setting-icon speed-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 14a8 8 0 1 1 16 0"></path>
              <path d="M12 14 16 8"></path>
              <path d="M12 14h.01"></path>
            </svg>
          </span>
          <label class="sr-only" for="endpointDelay">Response speed</label>
          <select id="endpointDelay" autocomplete="off" aria-label="Response speed">
            <option value="500" selected>Normal</option>
            <option value="900">Balanced</option>
            <option value="1500">Precise</option>
            <option value="2500">Calm</option>
          </select>
        </div>
      </section>

      <section class="transcript-grid" aria-label="Conversation history">
        <article class="transcript-card conversation-card">
          <div class="card-toolbar conversation-toolbar">
            <div>
              <h2>Conversation</h2>
              <span id="conversationModeBadge" class="lang-badge">Slovak -> German</span>
            </div>
            <button id="copyConversationBtn" class="icon-btn" type="button" title="Copy conversation" aria-label="Copy conversation">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <rect x="9" y="9" width="10" height="10" rx="1.5"></rect>
                <rect x="5" y="5" width="10" height="10" rx="1.5"></rect>
              </svg>
            </button>
          </div>
          <div id="conversationFeed" class="conversation-feed" aria-live="polite">
            <p class="conversation-empty">Start speaking to build the conversation history.</p>
          </div>
        </article>
      </section>

      <section class="conversation-actions">
        <button id="startBtn" class="primary-btn start-btn" type="button">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
            </svg>
          </span>
          <span id="startBtnText">Start Conversation</span>
        </button>
      </section>

      <section class="runtime-state" hidden>
        <p class="session-label">Signed in: <strong id="currentUser"></strong></p>
        <p id="usageInfo" class="usage-info"></p>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
        <label for="outputMode">Output mode</label>
        <select id="outputMode" autocomplete="off">
          <option value="speaker" selected>Speaker</option>
          <option value="headphones">Headphones</option>
        </select>
        <label for="voiceOutputToggle">
          <input id="voiceOutputToggle" type="checkbox" checked>
          Voice output
        </label>
        <div class="meter" aria-hidden="true">
          <div class="meter-bar" id="levelBar"></div>
        </div>
        <p id="status" class="status-text">Ready</p>
        <span id="connectionChip" class="state-chip">Ready</span>
        <span id="micChip" class="state-chip">Microphone off</span>
        <span id="playbackChip" class="state-chip">Silent</span>
        <span id="modeChip" class="state-chip">Speaker</span>
        <p id="latencyInfo" class="latency-info">Latency: -</p>
        <button id="repeatLastBtn" class="ghost-btn" type="button" disabled>Repeat voice</button>
        <button id="stopAudioBtn" class="ghost-btn" type="button">Stop audio</button>
        <button id="textOnlyBtn" class="ghost-btn" type="button">Text mode</button>
        <button id="clearBtn" class="ghost-btn" type="button">Clear text</button>
        <button id="copyAllBtn" class="ghost-btn" type="button">Copy all</button>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
