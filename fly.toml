app = "soniox-prekladac"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  USAGE_DB_PATH = "/data/usage.sqlite"
  TRUST_FLY_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
[[mounts]]
  source = "translator_data"
  destination = "/data"
